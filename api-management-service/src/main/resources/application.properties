spring.application.name=api-management-service
server.port=8081

# Secrets are read from environment variables, or from a .env file (see .env.example).
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

info.app.name=API Management Service
info.app.description=Management Service for users, routes and gateway policies

spring.datasource.url=${GATEKEEPER_DB_URL:jdbc:mysql://localhost:3306/gatekeeper_management}
spring.datasource.username=${GATEKEEPER_DB_USERNAME:root}
spring.datasource.password=${GATEKEEPER_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

security.jwt.expiration-seconds=3600
# Required, at least 32 characters (HS256). No default on purpose.
security.jwt.secret=${GATEKEEPER_JWT_SECRET}

# Accounts created on first start if they do not exist yet (see PlatformAccountBootstrap).
gatekeeper.bootstrap.platform-admin-username=${GATEKEEPER_PLATFORM_ADMIN_USERNAME:platform-admin}
gatekeeper.bootstrap.platform-admin-password=${GATEKEEPER_PLATFORM_ADMIN_PASSWORD:}
gatekeeper.bootstrap.gateway-username=${GATEKEEPER_GATEWAY_USERNAME:gateway-service}
gatekeeper.bootstrap.gateway-password=${GATEKEEPER_GATEWAY_PASSWORD:}

gateway.kafka.configuration-topic=${GATEKEEPER_CONFIGURATION_TOPIC:gateway-configuration-events}
spring.kafka.bootstrap-servers=${GATEKEEPER_KAFKA_SERVERS:localhost:9092}
