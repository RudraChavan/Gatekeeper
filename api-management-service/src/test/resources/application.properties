spring.application.name=api-management-service

info.app.name=API Management Service
info.app.description=Management Service for users, routes and gateway policies

spring.datasource.url=jdbc:h2:mem:gatekeeper_management;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

# Fake values for tests only
security.jwt.secret=test-only-secret-not-used-anywhere-else-0123456789
security.jwt.expiration-seconds=3600
gateway.kafka.configuration-topic=gateway-configuration-events
gatekeeper.bootstrap.platform-admin-password=
gatekeeper.bootstrap.gateway-password=
